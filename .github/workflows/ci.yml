name: ci
'on':
  pull_request: null
  push:
    branches:
    - main
    - feat/standardize-ci-renovate
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: engels74/automation/actions/dispatch-guard@v1.0.0
      with:
        token: ${{ github.token }}
        pr-number: ${{ inputs.pr-number }}
        expected-head-sha: ${{ inputs.expected-head-sha }}
  quality:
    needs: guard
    uses: engels74/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bun run check:biome && bun run check
  test-build:
    needs: guard
    uses: engels74/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bash .github/scripts/check.sh
  hygiene:
    needs: guard
    uses: engels74/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: SKIP=no-commit-to-branch,biome bunx --no-install prek run --all-files --hook-stage manual
  required:
    name: ci / required
    if: always()
    needs:
    - guard
    - quality
    - test-build
    - hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: engels74/automation/actions/dispatch-guard@v1.0.0
      with:
        token: ${{ github.token }}
        pr-number: ${{ inputs.pr-number }}
        expected-head-sha: ${{ inputs.expected-head-sha }}
    - uses: engels74/automation/actions/gate@v1.0.0
      with:
        needs: ${{ toJSON(needs) }}
        required: guard quality test-build hygiene
